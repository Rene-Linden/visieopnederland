---
layout: default
---
<article class="article-view wrap pagina">
  {%- if page.eyebrow %}
  <p class="eyebrow">{{ page.eyebrow }}</p>
  {%- endif %}
  <h1>{{ page.title }}</h1>
  {%- if page.intro %}
  <p class="art-sub">{{ page.intro }}</p>
  {%- endif %}
  <div class="art-tekst">
{{ content }}
  </div>
</article>
